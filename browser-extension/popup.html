<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
    body {
        width: 280px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        padding: 16px;
        margin: 0;
    }
    h1 {
        font-size: 14px;
        margin: 0 0 12px 0;
        color: #1f2937;
    }
    label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        color: #374151;
        margin-bottom: 4px;
    }
    input {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        font-size: 12px;
        margin-bottom: 10px;
    }
    button {
        width: 100%;
        padding: 8px;
        border: none;
        border-radius: 6px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        font-weight: 600;
        cursor: pointer;
        font-size: 12px;
    }
    button.secondary {
        background: #f3f4f6;
        color: #374151;
    }
    button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }
    hr {
        border: none;
        border-top: 1px solid #e5e7eb;
        margin: 14px 0;
    }
    p.hint {
        font-size: 11px;
        color: #6b7280;
        margin-top: 10px;
    }
    #status, #auth-status {
        font-size: 11px;
        margin-top: 4px;
        min-height: 14px;
    }
    #auth-status.error {
        color: #dc2626;
    }
    #auth-status.ok {
        color: #10b981;
    }
    #logged-in-view p {
        font-size: 12px;
        color: #374151;
        margin-bottom: 8px;
    }
</style>
</head>
<body>
    <h1>📇 Twikey Outreach</h1>

    <div id="login-view">
        <label>E-mailadres</label>
        <input type="email" id="login-email" placeholder="jij@bedrijf.nl">
        <label>Wachtwoord</label>
        <input type="password" id="login-password">
        <button id="login-button">Inloggen</button>
    </div>

    <div id="logged-in-view" style="display:none;">
        <p>Ingelogd als <strong id="account-name">-</strong></p>
        <button id="logout-button" class="secondary">Uitloggen</button>
    </div>

    <div id="auth-status"></div>

    <hr>

    <label>Backend API-URL</label>
    <input type="text" id="api-base" placeholder="https://twikey-platform-backend.onrender.com">
    <button id="save-button" class="secondary">Opslaan</button>
    <div id="status"></div>

    <p class="hint">
        Ga naar een LinkedIn-profielpagina (linkedin.com/in/...) om het
        outreach-paneel rechtsonder te zien verschijnen. Je moet ingelogd
        zijn om templates te laden en acties te loggen.
    </p>
    <script src="popup.js"></script>
</body>
</html>
