<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Email Generator</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 32px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #F5F6F9;
            color: #1f2937;
        }
        h1 {
            margin: 0 0 8px;
            color: #18407D;
            font-size: 20px;
        }
        p {
            margin: 0 0 24px;
            color: #6b7280;
        }
        .placeholder {
            border: 1px dashed #d1d5db;
            border-radius: 8px;
            padding: 48px 24px;
            text-align: center;
            background: #fff;
        }
        .placeholder span {
            font-size: 32px;
            display: block;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>
    <h1>Email Generator</h1>
    <p>Deze tool is nog in opbouw.</p>
    <div class="placeholder">
        <span>✉️</span>
        Nog geen functionaliteit beschikbaar.
    </div>
</body>
</html>
