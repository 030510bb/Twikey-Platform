<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nieuw wachtwoord instellen - Twikey Sales Platform</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 14px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
            padding: 40px;
            width: 100%;
            max-width: 400px;
        }

        .logo {
            font-size: 28px;
            font-weight: 700;
            color: #333;
            margin-bottom: 4px;
        }

        .logo span {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 28px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #444;
            margin-bottom: 6px;
            margin-top: 16px;
        }

        input[type="password"] {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
        }

        input[type="password"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }

        button[type="submit"] {
            width: 100%;
            margin-top: 24px;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        button[type="submit"]:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        button[type="submit"]:hover:not(:disabled) {
            opacity: 0.92;
        }

        #form-message {
            display: none;
            margin-top: 16px;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 13px;
        }

        #form-message.ok {
            display: block;
            background: #f0fdf4;
            color: #166534;
        }

        #form-message.error {
            display: block;
            background: #fef2f2;
            color: #b91c1c;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #667eea;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        #no-token-notice {
            display: none;
            font-size: 13px;
            color: #b91c1c;
            background: #fef2f2;
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">🚀 Twikey <span>Sales Platform</span></div>
        <div class="subtitle">Kies een nieuw wachtwoord voor je account.</div>

        <div id="no-token-notice">Deze link mist het reset-token. Vraag een nieuwe aan via "Wachtwoord vergeten".</div>

        <form id="reset-form">
            <label for="new-password">Nieuw wachtwoord</label>
            <input type="password" id="new-password" autocomplete="new-password" required minlength="8">

            <label for="confirm-password">Bevestig nieuw wachtwoord</label>
            <input type="password" id="confirm-password" autocomplete="new-password" required minlength="8">

            <button type="submit" id="reset-button">Wachtwoord instellen</button>
            <div id="form-message"></div>
        </form>

        <a class="back-link" href="login.html">&larr; Terug naar inloggen</a>
    </div>

    <script>
        const PRODUCTION_API_BASE = 'https://api.justmeet.tech';
        const isLocal = location.protocol === 'file:' ||
            location.hostname === 'localhost' ||
            location.hostname === '127.0.0.1';
        const API_BASE = isLocal ? 'http://localhost:8000' : PRODUCTION_API_BASE;

        const params = new URLSearchParams(location.search);
        const token = params.get('token');

        const form = document.getElementById('reset-form');
        const messageEl = document.getElementById('form-message');
        const button = document.getElementById('reset-button');

        if (!token) {
            document.getElementById('no-token-notice').style.display = 'block';
            form.querySelectorAll('input, button').forEach(el => el.disabled = true);
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            messageEl.className = '';
            messageEl.textContent = '';

            if (newPassword.length < 8) {
                messageEl.className = 'error';
                messageEl.textContent = 'Wachtwoord moet minstens 8 tekens zijn.';
                return;
            }
            if (newPassword !== confirmPassword) {
                messageEl.className = 'error';
                messageEl.textContent = 'De twee wachtwoorden komen niet overeen.';
                return;
            }

            button.disabled = true;
            button.textContent = 'Bezig...';

            try {
                const res = await fetch(`${API_BASE}/api/auth/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, new_password: newPassword }),
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok) {
                    throw new Error(data.detail || `HTTP ${res.status}`);
                }
                messageEl.className = 'ok';
                messageEl.textContent = '✓ Wachtwoord ingesteld. Je kunt nu inloggen met je nieuwe wachtwoord.';
                form.querySelectorAll('input, button').forEach(el => el.disabled = true);
                setTimeout(() => { location.href = 'login.html'; }, 2000);
            } catch (err) {
                messageEl.className = 'error';
                messageEl.textContent = err.message || 'Er ging iets mis. Probeer het opnieuw.';
                button.disabled = false;
                button.textContent = 'Wachtwoord instellen';
            }
        });
    </script>
</body>
</html>
