# Render "Blueprint" file. Render reads this automatically when you connect
# your GitHub repo and choose "New + -> Blueprint", and sets up both
# services below in one go. See DEPLOY.md for the full walkthrough.
services:
  # The FastAPI backend (Gmail sending/reading).
  - type: web
    runtime: docker
    name: twikey-platform-backend
    plan: free              # Gratis; slaapt na ~15 min inactiviteit. Zet dit
                            # om naar "starter" (~$7/maand) zodra je wilt dat
                            # de backend altijd direct reageert.
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      # Postgres connection string for your Supabase project (Project
      # Settings -> Database -> Connection string -> URI). Required - the
      # backend stores everything here now (accounts, contacts, campaigns,
      # LinkedIn-log) instead of the old local SQLite file, so this data no
      # longer disappears on every deploy. See README.md, "Database
      # (Supabase)". Never commit the real value to git.
      - key: DATABASE_URL
        sync: false
      - key: SEND_AS_EMAIL
        value: sales@twikeycampaigns.nl
      - key: CORS_ORIGINS
        value: "*"          # Tighten this (or use CORS_ORIGIN_REGEX below) once
                            # your custom domain(s) are confirmed working
      # Optional, safer alternative to CORS_ORIGINS once your custom domain
      # is live: matches justmeet.tech itself and every subdomain of it (e.g.
      # app.justmeet.tech, a customer's own klant.justmeet.tech). Has no effect
      # while CORS_ORIGINS is still "*" above - only start relying on this
      # once you remove/narrow CORS_ORIGINS. See "Eigen domein koppelen" in
      # DEPLOY.md.
      - key: CORS_ORIGIN_REGEX
        value: "https://([a-zA-Z0-9-]+\\.)?justmeet\\.tech"
      # Paste the full content of your service-account JSON key file as the
      # value for this one, in the Render dashboard. Never commit it to git.
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      # Shared secret required (as an X-Admin-Secret header) to create new
      # customer accounts via POST /api/admin/accounts. Set this to a long
      # random value in the Render dashboard - never commit the real value
      # to git. See README.md for the exact curl command that uses it.
      - key: ADMIN_SECRET
        sync: false
      # Encrypts customer SMTP passwords at rest (see POST /api/email-settings
      # and backend/crypto.py). Render generates a random value for this
      # automatically on first deploy - you don't need to set it yourself.
      # Never change it afterwards: existing saved SMTP passwords can only be
      # decrypted with the key they were encrypted under.
      - key: ENCRYPTION_KEY
        generateValue: true
      # Optional. Shared, platform-level key (not per customer account) used
      # to generate AI concept-replies to incoming customer replies (Replies
      # tab). Without it, concept-replies fall back to the matched objection
      # category's standard suggested text. See README.md and DEPLOY.md.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Optional: automatically create this one account on first startup if
      # it doesn't exist yet, so you don't have to run the admin bootstrap
      # curl by hand. Only ever creates the account if missing - never
      # resets an existing password - so it's safe to leave these set
      # permanently. Leave both unset to disable this entirely.
      - key: SEED_ACCOUNT_EMAIL
        sync: false
      - key: SEED_ACCOUNT_PASSWORD
        sync: false
      # Used to build the open-tracking pixel and click-tracking links that
      # get embedded in campaign emails (A/B Test tab), and the frontend's
      # own PRODUCTION_API_BASE points here too. Update these two if your
      # actual custom domains (or Render service URLs, if you haven't set
      # up custom domains yet) differ from the values below - see "Eigen
      # domein koppelen (justmeet.tech)" in DEPLOY.md.
      - key: BACKEND_PUBLIC_URL
        value: https://api.justmeet.tech
      - key: FRONTEND_PUBLIC_URL
        value: https://app.justmeet.tech
      # NOTE on persistence: contacts/campaigns/accounts/LinkedIn-log data
      # lives in Supabase Postgres (DATABASE_URL above, see
      # backend/database.py) - not on this service's own disk, so it
      # survives every deploy/restart, unlike the old local-SQLite setup.

  # The static front-end dashboard.
  - type: web
    runtime: static
    name: twikey-platform-frontend
    staticPublishPath: ./frontend
